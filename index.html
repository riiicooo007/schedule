<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RICO – Routine, Itinerary &amp; Calendar Organizer</title>
  <meta name="description" content="RICO – Routine, Itinerary &amp; Calendar Organizer. Make time work for you: lịch, việc cần làm, nhắc lịch bằng thông báo, chuông và email.">
  <meta name="theme-color" content="#1f5fef">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b8cff'/%3E%3Cstop offset='1' stop-color='%232a4fe0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Crect x='14' y='18' width='36' height='32' rx='7' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Cpath d='M23 12v10M41 12v10' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M23 34l7 7 11-12' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <!-- Áp dụng giao diện Sáng/Tối ngay từ đầu để tránh nháy màu -->
  <script>
    (function () {
      try {
        var d = JSON.parse(localStorage.getItem('tp_data_v1') || 'null');
        var t = d && d.settings && d.settings.theme;
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* bỏ qua */ }
    })();
  </script>

  <link rel="stylesheet" href="font.css">
</head>
<body>
  <div id="root"></div>
  <noscript>Ứng dụng cần bật JavaScript để hoạt động. Vui lòng bật JavaScript trong trình duyệt.</noscript>

  <!-- Thư viện qua CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script crossorigin src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Toàn bộ logic ứng dụng (JSX được Babel biên dịch trực tiếp trên trình duyệt) -->
  <script type="text/babel" src="react.js"></script>
</body>
</html>
